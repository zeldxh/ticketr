spring.application.name=SistemaBoletos

# Carga variables desde .env en la raíz del proyecto (si existe)
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_boletos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Server
server.port=8080

# Currency display settings (primary can be CRC or USD)
app.currency.primary=CRC
app.currency.usd-to-crc=520.0
